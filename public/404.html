<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>一方 · 加载中</title>
  <script>
    // 获取当前访问的路径
    var path = window.location.pathname;
    // 把路径作为参数带到首页，让 Vue Router 接管
    window.location.replace('/?redirect=' + encodeURIComponent(path));
  </script>
</head>
<body>
  正在加载...
</body>
</html>
